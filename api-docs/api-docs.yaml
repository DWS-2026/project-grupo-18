openapi: 3.1.0
info:
  title: CyberCert API
  description: CyberCert REST API documentation
  version: 1.0.0
servers:
- url: https://localhost:8443
  description: Generated server url
tags:
- name: Users
  description: REST operations on users
- name: Authentication
  description: Authentication endpoints
paths:
  /api/v1/images/{id}/media:
    get:
      tags:
      - image-rest-controller
      operationId: getImageFile
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
    put:
      tags:
      - image-rest-controller
      operationId: replaceImageFile
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                imageFile:
                  type: string
                  format: binary
              required:
              - imageFile
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /api/v1/comments/{id}:
    get:
      tags:
      - comment-rest-controller
      operationId: getCommentById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CommentDTO'
    put:
      tags:
      - comment-rest-controller
      operationId: updateComment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CommentDTO'
    delete:
      tags:
      - comment-rest-controller
      operationId: deleteComment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /api/v1/certifications/{id}:
    get:
      tags:
      - certification-rest-controller
      operationId: getCertificationById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CertificationDTO'
    put:
      tags:
      - certification-rest-controller
      operationId: updateCertification
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificationDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CertificationDTO'
    delete:
      tags:
      - certification-rest-controller
      operationId: deleteCertification
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CertificationDTO'
  /api/v1/users/register:
    post:
      tags:
      - Users
      summary: Create a user
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FullUserDTO'
        required: true
      responses:
        '200':
          description: User created successfully
  /api/v1/users/me/profile-image:
    post:
      tags:
      - Users
      summary: Upload or update profile image
      description: 'Allows the authenticated user to upload or update their profile
        image. Supported formats: JPEG, PNG, WebP. Maximum size: 10MB'
      operationId: uploadProfileImage
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                imageFile:
                  type: string
                  format: binary
              required:
              - imageFile
      responses:
        '200':
          description: Image uploaded successfully, the updated profile is returned
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserDTO'
        '400':
          description: Empty file, unsupported format, or file too large
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserDTO'
        '401':
          description: Unauthorized or expired token
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserDTO'
      security:
      - bearerAuth: []
  /api/v1/shopping-cart-items/{certificationId}:
    post:
      tags:
      - shopping-cart-items-rests
      operationId: addCartItem
      parameters:
      - name: certificationId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
    delete:
      tags:
      - shopping-cart-items-rests
      operationId: deleteCartItem
      parameters:
      - name: certificationId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
  /api/v1/comments:
    get:
      tags:
      - comment-rest-controller
      operationId: getAllComments
      parameters:
      - name: certificationId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: pageable
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Pageable'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageCommentDTO'
    post:
      tags:
      - comment-rest-controller
      operationId: createComment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CommentDTO'
  /api/v1/certifications/{id}/image:
    post:
      tags:
      - certification-rest-controller
      operationId: createCertificationImage
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                imageFile:
                  type: string
                  format: binary
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ImageDTO'
    delete:
      tags:
      - certification-rest-controller
      operationId: deleteCertificationImage
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ImageDTO'
  /api/v1/certifications/{id}/document:
    get:
      tags:
      - certification-rest-controller
      operationId: getCertificationDocument
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: binary
    post:
      tags:
      - certification-rest-controller
      operationId: uploadCertificationDocument
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                documentFile:
                  type: string
                  format: binary
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /api/v1/certifications/:
    get:
      tags:
      - certification-rest-controller
      operationId: getAllCertifications
      parameters:
      - name: pageable
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Pageable'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageCertificationDTO'
    post:
      tags:
      - certification-rest-controller
      operationId: createCertification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificationDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CertificationDTO'
  /api/v1/auth/refresh:
    post:
      tags:
      - Authentication
      summary: Refresh token
      description: Obtains a new access token using the refresh token
      operationId: refreshToken
      parameters:
      - name: RefreshToken
        in: cookie
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Token refreshed successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication
      summary: Log out
      description: Invalidates the user's JWT tokens
      operationId: logOut
      responses:
        '200':
          description: Logged out successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: User login
      description: Authenticates a user and returns JWT tokens in cookies
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Login successful, tokens created in cookies
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /api/v1/users/update/{id}:
    patch:
      tags:
      - Users
      summary: Update a user by id (ADMIN only)
      description: Allows ADMIN to update any user's username and email
      operationId: updateUser
      parameters:
      - name: id
        in: path
        description: User identifier
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FullUserDTO'
        required: true
      responses:
        '200':
          description: User updated successfully
        '400':
          description: Invalid request data (e.g., attempting to modify id or profileImageId)
        '403':
          description: Forbidden - ADMIN role required
        '404':
          description: User not found
  /api/v1/users/me:
    get:
      tags:
      - Users
      summary: Get the authenticated user's profile
      description: Returns the information for the currently authenticated user, including
        the ID of their profile image
      operationId: getMe
      responses:
        '200':
          description: User profile returned successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserDTO'
        '401':
          description: Unauthorized or expired token
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserDTO'
      security:
      - bearerAuth: []
    patch:
      tags:
      - Users
      summary: Update your own profile
      description: Allows the authenticated user to update their own username and
        email
      operationId: updateMyProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FullUserDTO'
        required: true
      responses:
        '200':
          description: Profile updated successfully
        '400':
          description: Invalid request data (e.g., attempting to modify id or profileImageId)
        '401':
          description: Unauthorized or expired token
  /api/v1/users:
    get:
      tags:
      - Users
      summary: Get all users
      operationId: getAllUsers
      parameters:
      - name: pageable
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Pageable'
      responses:
        '200':
          description: User list returned successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageUserDTO'
  /api/v1/users/{id}:
    get:
      tags:
      - Users
      summary: Get a user by id
      description: Returns the information for a specific user, including the ID of
        their profile image (requires ADMIN role)
      operationId: getUserById
      parameters:
      - name: id
        in: path
        description: User identifier
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: User found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserDTO'
        '404':
          description: User not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserDTO'
        '403':
          description: Forbidden - ADMIN role required
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserDTO'
  /api/v1/shopping-cart-items/user/{userId}:
    get:
      tags:
      - shopping-cart-items-rests
      operationId: showUserCart
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShoppingCartItemDTO'
  /api/v1/shopping-cart-items/me:
    get:
      tags:
      - shopping-cart-items-rests
      operationId: showMyItems
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShoppingCartItemDTO'
  /api/v1/images/{id}:
    get:
      tags:
      - image-rest-controller
      operationId: getImage
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ImageDTO'
  /api/v1/users/delete/{id}:
    delete:
      tags:
      - Users
      summary: Delete a user
      operationId: deleteUser
      parameters:
      - name: id
        in: path
        description: User identifier
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: User deleted successfully
        '404':
          description: User not found
components:
  schemas:
    CommentDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        content:
          type: string
        authorUsername:
          type: string
        certificationId:
          type: integer
          format: int64
        rating:
          type: integer
          format: int32
    CertificationDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        duration:
          type: integer
          format: int32
        format:
          type: string
        language:
          type: string
        level:
          type: string
        requirements:
          type: array
          items:
            type: string
        contents:
          type: array
          items:
            type: string
        image:
          $ref: '#/components/schemas/ImageDTO'
    ImageDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
    FullUserDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
          readOnly: true
        username:
          type: string
          example: juan
        email:
          type: string
          example: juan@mail.com
        password:
          type: string
          example: secret123
        profileImageId:
          type: integer
          format: int64
          example: 10
          readOnly: true
    UserDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
          readOnly: true
        username:
          type: string
          example: juan
        email:
          type: string
          example: juan@mail.com
        profileImageId:
          type: integer
          format: int64
          example: 10
          readOnly: true
    AuthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - SUCCESS
          - FAILURE
        message:
          type: string
        error:
          type: string
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
    Pageable:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        sort:
          type: array
          items:
            type: string
    PageUserDTO:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserDTO'
        number:
          type: integer
          format: int32
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: '#/components/schemas/PageableObject'
        sort:
          $ref: '#/components/schemas/SortObject'
        empty:
          type: boolean
    PageableObject:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        paged:
          type: boolean
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        sort:
          $ref: '#/components/schemas/SortObject'
        unpaged:
          type: boolean
    SortObject:
      type: object
      properties:
        empty:
          type: boolean
        sorted:
          type: boolean
        unsorted:
          type: boolean
    ShoppingCartItemDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        certificationId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
    PageCommentDTO:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: '#/components/schemas/CommentDTO'
        number:
          type: integer
          format: int32
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: '#/components/schemas/PageableObject'
        sort:
          $ref: '#/components/schemas/SortObject'
        empty:
          type: boolean
    PageCertificationDTO:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: '#/components/schemas/CertificationDTO'
        number:
          type: integer
          format: int32
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: '#/components/schemas/PageableObject'
        sort:
          $ref: '#/components/schemas/SortObject'
        empty:
          type: boolean

